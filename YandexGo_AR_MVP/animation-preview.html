<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка анимаций</title>
<style>*{box-sizing:border-box}body{margin:24px;font:16px/1.5 system-ui;background:#e6e6e6;color:#202027}main{display:flex;flex-wrap:wrap;gap:20px}.card{width:360px;max-width:100%;background:white;padding:16px;border-radius:16px}.area{position:relative;width:100%;height:340px;background:#cfd4d9;overflow:hidden}.point{position:absolute;left:50%;top:270px;width:12px;height:12px;transform:translate(-50%,-50%);background:#ffcd00;border:2px solid #333;border-radius:50%}.asset{position:absolute;object-fit:contain;transform:translate(-50%,-50%)}a{color:#143ba5}code{word-break:break-all}canvas{display:block;max-width:100%}</style>
<h1>Анимации газа и тормоза</h1><p>Проверка без камеры. Жёлтая точка — место крепления; GIF находится над ней. Размеры показаны в условных пикселях мишени.</p><main id="cards"></main><p>Чёрный фон находится внутри исходных GIF. Он сохранён. Для прозрачности нужен повторный экспорт.</p><p><a href="./ar.html?demo=1">Проверить в уроке без камеры</a> · <a href="./index.html">На главную</a></p>
<script type="module">
import { animations } from './animation-config.js';
import { paintEffect } from './effects.js';
import { steps } from './marker-config.js';
const canvases=[];
for(const id of ['throttle','brake']) {
 const config=animations[id];const step=steps.find(s=>s.id===id);
 const card=document.createElement('section');card.className='card';
 const heading=document.createElement('h2');heading.textContent=step.title;card.append(heading);
 const area=document.createElement('div');area.className='area';
 const dot=document.createElement('i');dot.className='point';area.append(dot);
 if(config){const image=document.createElement('img');image.className='asset';image.src=config.src;image.alt=step.title;
 Object.assign(image.style,{width:config.width+'px',height:config.height+'px',left:`calc(50% + ${config.offsetX||0}px)`,top:(270+(config.offsetY||0))+'px'});area.append(image);
 image.onerror=()=>{description.textContent='Не загрузился файл '+config.src;};}
 const description=document.createElement('p');description.textContent=config?`${config.src} · ${config.width}×${config.height}`:'Включён встроенный эффект';
 card.append(area,description);const title=document.createElement('p');title.textContent='Встроенная стрелка (для сравнения):';card.append(title);
 const canvas=document.createElement('canvas');canvas.width=320;canvas.height=180;card.append(canvas);
 // Keep the original logical coordinate scale while centering this small preview.
 const ctx=canvas.getContext('2d');const off=document.createElement('canvas');off.width=1120;off.height=1000;
 canvases.push({ctx,off,active:{step,layout:{[id]:[0,0]}}});
 document.querySelector('#cards').append(card);
}
function draw(now){for(const {ctx,off,active} of canvases){paintEffect(off.getContext('2d'),active,now/1000);ctx.clearRect(0,0,320,180);ctx.drawImage(off,400,410,320,180,0,0,320,180);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
