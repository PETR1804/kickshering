<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191e">
  <title>Мишень · Яндекс Go AR</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="target-page">
  <header class="target-header shell">
    <a class="brand" href="./index.html" aria-label="Яндекс Go, главная">Яндекс<span>Go</span></a>
    <p>Наведи камеру телефона на самокат</p>
    <button class="button light" id="fullscreen" type="button" hidden>На весь экран <span aria-hidden="true">↗</span></button>
  </header>
  <main class="target-stage" id="stage">
    <img src="./assets/scooter-target.png" width="1120" height="1000" alt="Изображение самоката для распознавания камерой">
  </main>
  <script type="module">
    const button = document.querySelector('#fullscreen');
    const stage = document.querySelector('#stage');
    if (document.fullscreenEnabled && stage.requestFullscreen) {
      button.hidden = false;
      button.addEventListener('click', async () => {
        try {
          await stage.requestFullscreen();
        } catch {
          button.textContent = 'Полноэкранный режим недоступен';
        }
      });
    }
  </script>
</body>
</html>
